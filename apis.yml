name: Tier
description: >-
  Tier (now operating as Dott following the 2024 merger of TIER Mobility and
  Dott) is a European micromobility operator providing shared e-scooters and
  e-bikes across more than 400 cities in Europe and the Middle East. The company
  exposes a partner-facing Dott Partner API — an API-Key-gated data feed
  (including GBFS-style vehicle-availability data) governed by its published API
  Licence — alongside consumer rider apps for iOS and Android. Founded in 2018
  and headquartered in Amsterdam, Tier/Dott was backed by Northzone, Point Nine,
  and Speedinvest.
